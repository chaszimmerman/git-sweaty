name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - Sync Heatmaps
      - Sync Strava Heatmaps
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  DASHBOARD_DATA_BRANCH: dashboard-data

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore site data
        run: |
          set -euo pipefail
          branch="${DASHBOARD_DATA_BRANCH}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            git fetch origin "${branch}"
            if git checkout "origin/${branch}" -- site/data.json; then
              echo "Using site/data.json from ${branch}."
              exit 0
            fi
            echo "Branch ${branch} exists but site/data.json is missing; writing empty fallback."
          else
            echo "No ${branch} branch yet; writing empty site/data.json."
          fi
          mkdir -p site
          cat <<JSON > site/data.json
          {
            "activities": [],
            "aggregates": {},
            "generated_at": null,
            "repo": "${GITHUB_REPOSITORY}",
            "type_meta": {},
            "types": [],
            "units": {
              "distance": "mi",
              "elevation": "ft"
            },
            "week_start": "sunday",
            "years": []
          }
          JSON

      - name: Stamp repository in site data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          path = "site/data.json"
          repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
          try:
            with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          except Exception:
            payload = {}
          if not isinstance(payload, dict):
            payload = {}
          if repo and "/" in repo:
            payload["repo"] = repo
          with open(path, "w", encoding="utf-8") as handle:
            json.dump(payload, handle, ensure_ascii=True, indent=2, sort_keys=True)
            handle.write("\n")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stamp app asset version
        run: |
          set -euo pipefail
          version="${GITHUB_SHA::12}"
          sed -i "s|__APP_VERSION__|${version}|g" site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages looks the artifact up ~1s after upload; GitHub sometimes
      # hasn't listed it yet ("No artifacts named github-pages were found").
      # Poll until it shows up so the deploy doesn't race the listing.
      - name: Wait for artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count')"
            if [ "${count}" -ge 1 ]; then
              echo "github-pages artifact listed (check ${attempt})."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github-pages artifact still not listed after 2 minutes; attempting deploy anyway."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
